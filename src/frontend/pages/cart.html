<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReTrade | Cart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --card-soft: #f8f9fc;
      --border: #e7ebf3;
      --text: #141b2d;
      --muted: #6d7787;
      --primary: #5b6df8;
      --primary-dark: #3d4ed6;
      --success: #1fbf75;
      --warning: #f5b14d;
      --danger: #eb5d5d;
      --shadow: 0 10px 28px rgba(17, 24, 39, 0.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background: linear-gradient(180deg, #f8f9fd 0%, #eef2ff 100%);
      color: var(--text);
    }
    a { text-decoration: none; color: inherit; }
    button, input { font: inherit; }

    .page-shell {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px 18px 42px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      background: rgba(255,255,255,0.72);
      border: 1px solid rgba(231,235,243,0.9);
      backdrop-filter: blur(10px);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 18px 22px;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 20px;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: linear-gradient(135deg, #6d7cff, #3d4ed6);
      color: white;
      display: grid;
      place-items: center;
      font-size: 16px;
      box-shadow: 0 10px 20px rgba(91,109,248,.25);
    }

    .crumbs {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-weight: 600;
      font-size: 13px;
    }

    .crumbs .current { color: var(--text); }

    .layout {
      display: grid;
      grid-template-columns: 1.5fr 0.85fr;
      gap: 24px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .cart-panel {
      padding: 22px;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 36px);
      letter-spacing: -0.04em;
    }

    .summary-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      background: #eef3ff;
      border: 1px solid #dfe7ff;
      color: var(--primary-dark);
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 800;
    }

    .items {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .cart-item {
      display: grid;
      grid-template-columns: 120px 1fr auto;
      gap: 18px;
      align-items: center;
      background: var(--card-soft);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
    }

    .item-image {
      width: 120px;
      height: 120px;
      border-radius: 14px;
      background-size: cover;
      background-position: center;
      border: 1px solid var(--border);
    }

    .item-info {
      min-width: 0;
    }

    .item-tag {
      display: inline-block;
      background: #ecfdf5;
      color: var(--success);
      border: 1px solid #d9f7ea;
      border-radius: 999px;
      padding: 5px 8px;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .item-name {
      font-size: 18px;
      font-weight: 700;
      margin: 0 0 8px;
      letter-spacing: -0.02em;
    }

    .item-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 10px;
    }

    .qty-box {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: white;
    }

    .qty-box button {
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--text);
      font-size: 18px;
    }

    .qty-box input {
      width: 56px;
      border: none;
      text-align: center;
      background: transparent;
      font-weight: 700;
    }

    .item-price {
      display: flex;
      flex-direction: column;
      align-items: end;
      justify-content: center;
      gap: 10px;
      min-width: 110px;
    }

    .price-value {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .remove-btn {
      border: none;
      background: #fff0f0;
      color: var(--danger);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .empty-state {
      display: none;
      text-align: center;
      padding: 40px 16px 12px;
      color: var(--muted);
    }

    .empty-state.show {
      display: block;
    }

    .empty-icon {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .empty-state h3 {
      margin: 0 0 8px;
      color: var(--text);
      font-size: 22px;
      letter-spacing: -0.03em;
    }

    .empty-state p {
      margin: 0 0 18px;
      font-size: 14px;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .summary-panel {
      padding: 24px 20px;
      height: fit-content;
      position: sticky;
      top: 20px;
    }

    .summary-title {
      font-size: 16px;
      font-weight: 800;
      margin: 0 0 18px;
    }

    .summary-line {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 14px;
    }

    .summary-line strong {
      color: var(--text);
    }

    .summary-divider {
      height: 1px;
      background: var(--border);
      margin: 16px 0;
    }

    .total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin: 8px 0 18px;
    }

    .checkout-btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      padding: 14px 18px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(91,109,248,.2);
    }

    .support-box {
      margin-top: 18px;
      background: var(--card-soft);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .toast {
      position: fixed;
      right: 26px;
      bottom: 26px;
      padding: 14px 18px;
      border-radius: 12px;
      background: rgba(20, 27, 45, 0.95);
      color: white;
      box-shadow: 0 16px 28px rgba(17,24,39,0.25);
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: 0.25s ease;
      z-index: 200;
    }

    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      .summary-panel { position: static; }
    }

    @media (max-width: 620px) {
      .cart-item {
        grid-template-columns: 1fr;
        text-align: center;
      }
      .item-image {
        width: 100%;
        height: 180px;
      }
      .item-price {
        align-items: center;
      }
      .header-row {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">R</div>
        <span>ReTrade</span>
      </div>

      <div class="crumbs">
        <a href="landingwithlogin.html">Home</a>
        <span>›</span>
        <span class="current">Cart</span>
      </div>
    </header>

    <main class="layout">
      <section class="panel cart-panel">
        <div class="header-row">
          <h1>Your cart</h1>
          <div class="summary-pill"><i class="fa-solid fa-bag-shopping"></i> <span id="cartCount">0 items</span></div>
        </div>

        <div id="cartItems" class="items"></div>

        <div id="emptyState" class="empty-state">
          <div class="empty-icon">🛒</div>
          <h3>Your cart is empty</h3>
          <p>Add a few items to get started.</p>
          <button class="cta" onclick="window.location.href='landingwithlogin.html'">Continue shopping</button>
        </div>
      </section>

      <aside class="panel summary-panel">
        <h2 class="summary-title">Order summary</h2>

        <div class="summary-line"><span>Items</span><strong id="summaryItems">$0.00</strong></div>
        <div class="summary-line"><span>Shipping</span><strong id="summaryShipping">$0.00</strong></div>
        <div class="summary-line"><span>Tax</span><strong id="summaryTax">$0.00</strong></div>

        <div class="summary-divider"></div>

        <div class="total"><span>Total</span><span id="summaryTotal">$0.00</span></div>

        <button class="checkout-btn" id="checkoutBtn">Proceed to checkout</button>

        <div class="support-box">
          <strong>Buyer protection:</strong> Secure checkout, verified sellers, and delivery tracking included.
        </div>
      </aside>
    </main>
  </div>

  <div id="toast" class="toast" aria-live="polite"></div>

  <script>
    const cartKey = 'retradeCart';
    const cartItemsEl = document.getElementById('cartItems');
    const cartCountEl = document.getElementById('cartCount');
    const emptyState = document.getElementById('emptyState');
    const summaryItems = document.getElementById('summaryItems');
    const summaryShipping = document.getElementById('summaryShipping');
    const summaryTax = document.getElementById('summaryTax');
    const summaryTotal = document.getElementById('summaryTotal');
    const toast = document.getElementById('toast');

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function getCart() {
      try {
        const saved = JSON.parse(localStorage.getItem(cartKey) || '[]');
        return Array.isArray(saved) ? saved : [];
      } catch {
        return [];
      }
    }

    function saveCart(items) {
      localStorage.setItem(cartKey, JSON.stringify(items));
    }

    function formatMoney(value) {
      return '$' + Number(value || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function renderCart() {
      const cart = getCart();
      cartItemsEl.innerHTML = '';

      if (!cart.length) {
        emptyState.classList.add('show');
        cartCountEl.textContent = '0 items';
        summaryItems.textContent = '$0.00';
        summaryShipping.textContent = '$0.00';
        summaryTax.textContent = '$0.00';
        summaryTotal.textContent = '$0.00';
        return;
      }

      emptyState.classList.remove('show');
      cartCountEl.textContent = cart.reduce((sum, item) => sum + Number(item.quantity || 1), 0) + ' items';

      let subtotal = 0;
      let shipping = 0;
      let tax = 0;

      cart.forEach((item) => {
        const qty = Number(item.quantity || 1);
        const price = Number(item.price || 0);
        const itemTotal = price * qty;
        subtotal += itemTotal;
        shipping += Number(item.shipping || 0) * qty;

        const row = document.createElement('div');
        row.className = 'cart-item';
        row.innerHTML = `
          <div class="item-image" style="background-image:url('${item.image || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=900&q=80'}')"></div>
          <div class="item-info">
            <span class="item-tag">${item.condition || 'Good condition'}</span>
            <h3 class="item-name">${item.title || 'Item'}</h3>
            <div class="item-meta">
              <span>${item.category || 'General'}</span>
              <span>•</span>
              <span>Seller: ${item.seller || 'Verified Seller'}</span>
            </div>
            <div class="qty-box">
              <button type="button" data-action="decrease" data-id="${item.id}">−</button>
              <input type="number" min="1" value="${qty}" data-action="qty" data-id="${item.id}" />
              <button type="button" data-action="increase" data-id="${item.id}">+</button>
            </div>
          </div>
          <div class="item-price">
            <div class="price-value">${formatMoney(itemTotal)}</div>
            <button class="remove-btn" data-action="remove" data-id="${item.id}">Remove</button>
          </div>
        `;
        cartItemsEl.appendChild(row);
      });

      tax = subtotal * 0.08;
      const total = subtotal + shipping + tax;

      summaryItems.textContent = formatMoney(subtotal);
      summaryShipping.textContent = formatMoney(shipping);
      summaryTax.textContent = formatMoney(tax);
      summaryTotal.textContent = formatMoney(total);
    }

    function updateQty(id, delta) {
      const cart = getCart();
      const updated = cart.map((item) => {
        if (item.id !== id) return item;
        const nextQty = Math.max(1, (Number(item.quantity || 1) + delta));
        return { ...item, quantity: nextQty };
      });
      saveCart(updated);
      renderCart();
    }

    function removeFromCart(id) {
      const updated = getCart().filter((item) => item.id !== id);
      saveCart(updated);
      renderCart();
      showToast('Item removed from cart');
    }

    cartItemsEl.addEventListener('click', (event) => {
      const btn = event.target.closest('[data-action]');
      if (!btn) return;
      const action = btn.dataset.action;
      const id = btn.dataset.id;

      if (action === 'increase') updateQty(id, 1);
      if (action === 'decrease') updateQty(id, -1);
      if (action === 'remove') removeFromCart(id);
    });

    cartItemsEl.addEventListener('input', (event) => {
      const target = event.target.closest('[data-action="qty"]');
      if (!target) return;
      const id = target.dataset.id;
      const qty = Math.max(1, Number(target.value || 1));
      const cart = getCart().map((item) => item.id === id ? { ...item, quantity: qty } : item);
      saveCart(cart);
      renderCart();
    });

    document.getElementById('checkoutBtn').addEventListener('click', () => {
      if (!getCart().length) {
        showToast('Your cart is empty');
        return;
      }
      showToast('Proceeding to checkout');
      setTimeout(() => {
        window.location.href = 'payment.html';
      }, 500);
    });

    renderCart();
  </script>
</body>
</html>
